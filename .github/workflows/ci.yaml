name: Basic HTML Quality Check

on:

  push:

    branches: [ master ]

  pull_request:

    branches: [ master ]

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code

        uses: actions/checkout@v3

      - name: Verify HTML Structure

        run: |

          grep -q "<h1>" index.html && echo "HTML structure valid!"

# trigger workflow
